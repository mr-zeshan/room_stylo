name: mobile
description: "RoomStylo - AI powered interior design application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  google_sign_in: ^7.2.0
  http: ^1.6.0
  flutter_secure_storage: ^11.1.0
  image_picker: ^1.2.3
  http_parser: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
    - assets/images/onboarding/